{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Welcome back 👋</h2>
  <p class="muted">Log in to continue learning.</p>
  <form method="post" class="form">
    <label>Email or Username
      <input type="text" name="username" placeholder="you@example.com or username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">Log In</button>
  </form>
  <p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
