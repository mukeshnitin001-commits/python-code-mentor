{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Create your account 🚀</h2>
  <p class="muted">Register with your email and contact number to start learning.</p>
  <form method="post" class="form">
    <label>Email <span class="req">*</span>
      <input type="email" name="email" placeholder="you@example.com" required autofocus>
    </label>
    <label>Contact Number <span class="req">*</span>
      <div class="phone-row">
        <select name="country_code" required class="country-code-select" title="Country code">
          <option value="">Code</option>
          <option value="+91">🇮🇳 +91 (India)</option>
          <option value="+1">🇺🇸 +1 (USA/Canada)</option>
          <option value="+44">🇬🇧 +44 (UK)</option>
          <option value="+971">🇦🇪 +971 (UAE)</option>
          <option value="+966">🇸🇦 +966 (Saudi Arabia)</option>
          <option value="+90">🇹🇷 +90 (Turkey)</option>
          <option value="+61">🇦🇺 +61 (Australia)</option>
          <option value="+49">🇩🇪 +49 (Germany)</option>
          <option value="+33">🇫🇷 +33 (France)</option>
          <option value="+65">🇸🇬 +65 (Singapore)</option>
          <option value="+81">🇯🇵 +81 (Japan)</option>
          <option value="+82">🇰🇷 +82 (South Korea)</option>
          <option value="+86">🇨🇳 +86 (China)</option>
          <option value="+92">🇵🇰 +92 (Pakistan)</option>
          <option value="+880">🇧🇩 +880 (Bangladesh)</option>
          <option value="+94">🇱🇰 +94 (Sri Lanka)</option>
          <option value="+977">🇳🇵 +977 (Nepal)</option>
          <option value="+20">🇪🇬 +20 (Egypt)</option>
          <option value="+27">🇿🇦 +27 (South Africa)</option>
          <option value="+234">🇳🇬 +234 (Nigeria)</option>
          <option value="+55">🇧🇷 +55 (Brazil)</option>
          <option value="+52">🇲🇽 +52 (Mexico)</option>
          <option value="+39">🇮🇹 +39 (Italy)</option>
          <option value="+34">🇪🇸 +34 (Spain)</option>
          <option value="+31">🇳🇱 +31 (Netherlands)</option>
          <option value="+64">🇳🇿 +64 (New Zealand)</option>
          <option value="+60">🇲🇾 +60 (Malaysia)</option>
          <option value="+63">🇵🇭 +63 (Philippines)</option>
          <option value="+7">🇷🇺 +7 (Russia/Kazakhstan)</option>
          <option value="+41">🇨🇭 +41 (Switzerland)</option>
          <option value="+46">🇸🇪 +46 (Sweden)</option>
          <option value="+47">🇳🇴 +47 (Norway)</option>
          <option value="+45">🇩🇰 +45 (Denmark)</option>
        </select>
        <input type="tel" name="phone" placeholder="e.g. 9876543210" required pattern="[0-9]{7,15}" title="Enter a valid contact number (7-15 digits)">
      </div>
      <span class="hint">Country code is required — the full number (e.g. +919876543210) is saved.</span>
    </label>
    <label>Password <span class="req">*</span>
      <input type="password" name="password" required minlength="4">
    </label>
    <label>Confirm Password <span class="req">*</span>
      <input type="password" name="confirm_password" required minlength="4">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
  </form>
  <p class="muted center">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
