{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>🔒 Change Password</h2>
  <p class="muted">Update the password for your account ({{ user.username }}{% if user.email %} · {{ user.email }}{% endif %}).</p>
  <form method="post" class="form">
    <label>Current Password
      <input type="password" name="current_password" required autofocus>
    </label>
    <label>New Password
      <input type="password" name="new_password" required minlength="4">
    </label>
    <label>Confirm New Password
      <input type="password" name="confirm_password" required minlength="4">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Update Password</button>
  </form>
  <p class="muted center"><a href="{{ url_for('dashboard') }}">← Back to dashboard</a></p>
</div>
{% endblock %}
