{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="auth-card admin-auth">
  <h2>🛡️ Admin Portal</h2>
  <p class="muted">Restricted area — admin credentials required.</p>
  <form method="post" class="form">
    <label>Admin Username
      <input type="text" name="username" required autofocus autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Log In as Admin</button>
  </form>
  <p class="muted center">Students? <a href="{{ url_for('login') }}">Student login</a></p>
</div>
{% endblock %}
